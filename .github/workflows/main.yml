name: Build Modded APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Download Tools (Apktool & Signer)
        run: |
          wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar

      - name: Decompile APK
        run: |
          java -jar apktool.jar d gamehub.apk -o decoded_apk
          
      - name: Inject Mod Menu HTML
        run: |
          # Мод менюді APK-ның assets папкасына орналастыру
          mkdir -p decoded_apk/assets/
          cp mod_menu.html decoded_apk/assets/
          
      - name: Recompile APK
        run: |
          java -jar apktool.jar b decoded_apk -o modded_unsigned.apk
          
      - name: Sign Modded APK
        run: |
          java -jar signer.jar -a modded_unsigned.apk -o final_apk_dir
          
      - name: Upload Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALMAS-Mod-Menu-APK
          path: final_apk_dir/*.apk
